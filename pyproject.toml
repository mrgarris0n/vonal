[project]
name = "vonal"
version = "0.3.0"
description = "An esoteric programming language whose source form is an image"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["esolang", "esoteric", "interpreter", "op-art", "image"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]
dependencies = ["pillow>=10.0"]

[project.urls]
Repository = "https://github.com/mrgarris0n/vonal"
Issues = "https://github.com/mrgarris0n/vonal/issues"

[project.optional-dependencies]
# ruff and mypy are pinned to a minor series: a new release can add rules or
# sharpen inference and fail CI on a change that touched no code.
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.16,<0.17", "mypy>=2.3,<2.4"]

[project.scripts]
vonal = "vonal.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Listed rather than left to ruff's defaults, which change between releases.
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF"]

[tool.mypy]
# The package and tools are fully annotated, so strict holds them to it. The
# tests are not: pytest functions gain nothing from annotations.
strict = true
files = ["vonal", "tools"]
# The oldest Python the package supports, so the check does not accept
# anything newer than that, whatever interpreter it runs on.
python_version = "3.11"
